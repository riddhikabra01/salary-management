# Render and other hosts tell us which port to use through PORT; locally we fall back to 8080.
server.port=${PORT:8080}
# Smaller responses for the JSON and the bundled Angular files.
server.compression.enabled=true

# Local default: a file database under backend/data, so edits survive restarts.
# On Render this is overridden with an in-memory database (see render.yaml).
spring.datasource.url=jdbc:h2:file:./data/salary;AUTO_SERVER=TRUE
# Creates or updates tables to match the Employee entity. Handy for a demo;
# a real production system would use migrations (Flyway or Liquibase) instead.
spring.jpa.hibernate.ddl-auto=update
# Don't keep a database session open while the response is rendered; the services own their transactions.
spring.jpa.open-in-view=false
